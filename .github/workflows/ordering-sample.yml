name: Ordering sample
on:
  workflow_dispatch:
    inputs:
      base:
        description: Base revision of fisher
        required: true
        type: string
      measured:
        description: Revision to measure (leave blank to calibrate on the base)
        type: string
      calibrate_first:
        description: Calibrate on the same runner before comparing both revisions
        type: boolean
        default: false

concurrency:
  group: ordering-sample
  queue: max

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the release Rust toolchains
        timeout-minutes: 5
        env:
          BASE: ${{ inputs.base }}
          MEASURED: ${{ inputs.measured }}
        run: |
          ORDERING_RUSTUP_HOME=$(mktemp -d "$RUNNER_TEMP/ordering-rustup.XXXXXX")
          export ORDERING_RUSTUP_HOME
          strength/ordering prepare-rust -- "$BASE" "$MEASURED"
          printf 'ORDERING_RUSTUP_HOME=%s\n' "$ORDERING_RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Measure the sample
        env:
          BASE: ${{ inputs.base }}
          MEASURED: ${{ inputs.measured }}
          CALIBRATE_FIRST: ${{ inputs.calibrate_first }}
        shell: bash
        run: |
          {
            uname -sm
            if [ -n "$MEASURED" ]; then
              if [ "$CALIBRATE_FIRST" = true ]; then
                printf '\n## Calibration check\n\n'
                strength/ordering calibrate -- "$BASE" || exit
              fi
              printf '\n## Measurement\n\n'
              strength/ordering measure -- "$BASE" "$MEASURED"
            else
              printf '\n## Calibration\n\n'
              strength/ordering calibrate -- "$BASE"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
