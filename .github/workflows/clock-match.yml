name: Real-clock match
on:
  schedule:
    - cron: '17 7 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clock-match:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Download and verify fastchess
        timeout-minutes: 3
        run: scripts/install-fastchess "$RUNNER_TEMP/fastchess"
      - name: Download and install the PGN replay library
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/clock-venv"
          pip="$RUNNER_TEMP/clock-venv/bin/pip"
          if ! "$pip" install --timeout 15 --retries 2 --only-binary :all: --require-hashes -r scripts/clock-match-build-requirements.txt ||
             ! "$pip" install --timeout 15 --retries 2 --no-build-isolation --no-deps --require-hashes -r scripts/clock-match-requirements.txt; then
            echo "::error::PGN replay library download or installation failed."
            exit 1
          fi
      - name: Install the pinned Rust toolchain
        timeout-minutes: 3
        run: scripts/install-rust-toolchain
      - name: Download Rust build dependencies
        timeout-minutes: 3
        env:
          CARGO_NET_RETRY: 2
        run: |
          if ! cargo fetch --locked; then
            echo "::error::Rust build dependency download failed."
            exit 1
          fi
      - name: Play and verify the real-clock match
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          "$RUNNER_TEMP/clock-venv/bin/python" scripts/check-clock-match "$RUNNER_TEMP/fastchess" clock-match-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        timeout-minutes: 3
        with:
          name: clock-match
          path: clock-match-evidence/
          if-no-files-found: ignore
