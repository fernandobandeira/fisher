# pull_request_target uses main's workflow so a pull request cannot remove its check.
# Never check out the pull request head or run, source, or build anything from it.
# Pass pull request values through environment variables, never into shell source.
name: Guard-Change
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-change:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check Guard-Change lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # Fetch the event's exact commit from the public base repository as
          # objects only, including when the commit comes from a fork.
          git fetch --no-tags --no-recurse-submodules origin "$HEAD"

          event=pull_request
          script_revision=$BASE
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            event=push
            # Keep push bootstrap behavior when the base has no checker yet.
            base_entry=$(git ls-tree "$BASE" -- scripts/check-guard-change)
            if [ -z "$base_entry" ]; then
              script_revision=$HEAD
            fi
          fi

          git cat-file blob "$script_revision:scripts/check-guard-change" |
            python3 -I - --event "$event" "$BASE" "$HEAD"
