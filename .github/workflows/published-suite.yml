name: Published suite
on:
  schedule:
    - cron: '17 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        timeout-minutes: 3
        run: scripts/install-rust-toolchain
      - run: scripts/check-published-suite
