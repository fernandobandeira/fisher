name: Strength series
on:
  push:
    branches: [fisher-op4-series-trials]
    paths-ignore: ['**']
  workflow_dispatch:
    inputs:
      measured:
        description: Measured revision of fisher
        required: true
        type: string
      opponent:
        description: Opponent revision of fisher
        required: true
        type: string
      conditions:
        description: Series conditions
        required: true
        type: choice
        options: ['3', '4']

permissions:
  contents: read

env:
  MEASURED: ${{ inputs.measured }}
  OPPONENT: ${{ inputs.opponent }}
  CONDITIONS: ${{ inputs.conditions }}

jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.play.outputs.digest }}
    steps: &play_steps
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare runner
        run: |
          lscpu | sed -n '/^Model name:/p'
          scripts/install-fastchess "$RUNNER_TEMP/fastchess"
          python3 -m venv "$RUNNER_TEMP/series-venv"
          "$RUNNER_TEMP/series-venv/bin/python" -m pip install --require-hashes -r strength/series-requirements.txt
          printf '%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP/series-venv/bin" >> "$GITHUB_PATH"
      - name: Play first range
        id: play
        run: |
          case "$CONDITIONS" in
            3) count=100 ;;
            4) count=25 ;;
            *) echo "Unknown conditions: $CONDITIONS" >&2; exit 1 ;;
          esac
          if [ "$GITHUB_JOB" = repeat ]; then
            sed -i 's/(1_000_000, 2_000)/(100_000, 2_000)/' strength/series
          fi
          digest=$(strength/series "$MEASURED" "$OPPONENT" "$CONDITIONS" 1 "$count" "$RUNNER_TEMP/series" --concurrency 4)
          printf '%s\n' "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: series-${{ github.job }}
          path: |
            ${{ runner.temp }}/series/games.pgn
            ${{ runner.temp }}/series/games.jsonl
            ${{ runner.temp }}/series/fastchess.log

  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.play.outputs.digest }}
    steps: *play_steps

  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [first, repeat]
    steps:
      - name: Compare the digests
        env:
          FIRST: ${{ needs.first.outputs.digest }}
          REPEAT: ${{ needs.repeat.outputs.digest }}
        run: |
          lscpu | sed -n '/^Model name:/p'
          if [[ ! "$FIRST" =~ ^[0-9a-f]{64}$ || "$FIRST" != "$REPEAT" ]]; then
            printf 'Series digests differ or are missing. first=%s repeat=%s\n' "$FIRST" "$REPEAT" >&2
            exit 1
          fi
          printf 'Series digest: %s\n' "$FIRST"
