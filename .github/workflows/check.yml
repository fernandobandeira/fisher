name: Check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MUTATION_PARTS: '4'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
          fallback: none
      - run: scripts/check

  mutation-part:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - env:
          PART: ${{ matrix.part }}
        run: scripts/check-mutants --shard "$PART/$MUTATION_PARTS" --output target/mutation-part
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-part-${{ matrix.part }}
          path: target/mutation-part/mutants.out/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  mutation-part-zero:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  mutation:
    needs: [mutation-part, mutation-part-zero]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful mutation parts
        env:
          PARTS_RESULT: ${{ needs.mutation-part.result }}
        run: |
          if [ "$PARTS_RESULT" != success ]; then
            echo "::error::Mutation parts concluded with $PARTS_RESULT"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - run: scripts/check-mutants --self-test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-part-*
          path: target/mutation-parts
      - run: scripts/check-mutants --merge target/mutation-parts --parts "$MUTATION_PARTS"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2
          fallback: none
      - run: rustup component add llvm-tools
      - run: scripts/check-coverage --self-test
      - run: scripts/check-coverage
