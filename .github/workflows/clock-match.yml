name: Real-clock match
on:
  pull_request:

permissions:
  contents: read

jobs:
  clock-match:
    if: github.head_ref == 'fisher-684-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Plant stale cargo-clippy
        run: |
          rustup_home=${RUSTUP_HOME:-"$HOME/.rustup"}
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          toolchain="$rustup_home/toolchains/$channel-x86_64-unknown-linux-gnu"
          if [ -d "$toolchain" ]; then
            mv "$toolchain" "$RUNNER_TEMP/original-toolchain"
          fi
          mkdir -p "$toolchain/bin"
          touch "$toolchain/bin/cargo-clippy"
          printf 'RUSTUP_TOOLCHAIN=\n' >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        timeout-minutes: 3
        run: scripts/install-rust-toolchain
      - name: Download Rust build dependencies
        timeout-minutes: 3
        env:
          CARGO_NET_RETRY: 2
        run: |
          if ! cargo fetch --locked; then
            echo "::error::Rust build dependency download failed."
            exit 1
          fi
      - name: Build fisher in release mode
        timeout-minutes: 3
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo build --locked --release -p fisher
