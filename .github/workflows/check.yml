name: Check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # TODO(fisher-j9c): Remove after guard-change is required and has been seen failing from main.
      - name: Check Guard-Change lines
        if: github.event_name != 'schedule'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if ! git rev-parse --verify --end-of-options "$BASE^{commit}" >/dev/null 2>&1; then
            printf 'Guard-Change check could not find commit revision %s.\n' "$BASE" >&2
            exit 1
          fi
          script_revision=$BASE
          base_entry=$(git ls-tree "$BASE" -- scripts/check-guard-change)
          if [ -z "$base_entry" ]; then
            script_revision=$HEAD
          fi
          git cat-file blob "$script_revision:scripts/check-guard-change" |
            python3 -I - --event "$GITHUB_EVENT_NAME" "$BASE" "$HEAD"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
          fallback: none
      - run: scripts/check

  guard-change:
    name: guard-change
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 45 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - run: scripts/check-mutants --self-test
      - run: scripts/check-mutants

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2
          fallback: none
      - run: rustup component add llvm-tools
      - run: scripts/check-coverage --self-test
      - run: scripts/check-coverage
